name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "contract/**"
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            frontend/package-lock.json

      # The frontend imports ../contract/managed/contract/index.js directly
      # (it's not a published package) — it has to exist before typecheck
      # or build can resolve it.
      - name: Install the Compact compiler toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin compiler version
        run: compact update 0.31.1

      - name: Build the contract
        working-directory: contract
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build
