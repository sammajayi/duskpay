name: Contract CI

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install the Compact compiler toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin compiler version
        # Must match compact-runtime@0.16.0, which the published
        # midnight-js-contracts SDK currently requires — see README.
        run: compact update 0.31.1

      - name: Install dependencies
        run: npm ci

      - name: Compile the contract
        run: npm run build

      - name: Run simulator tests
        run: npm test
