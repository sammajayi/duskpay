services:
  midnight-node:
    image: midnightntwrk/midnight-node:0.22.5
    environment:
      - CFG_PRESET=dev
    ports:
      - "9944:9944"
      - "9933:9933"
    volumes:
      - midnight-node-data:/node/chain
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -X
        - POST
        - -H
        - "Content-Type: application/json"
        - --data
        - '{"id":1,"jsonrpc":"2.0","method":"system_health","params":[]}'
        - http://localhost:9944
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: midnightntwrk/indexer-standalone:4.2.1
    ports:
      - "8088:8088"
    volumes:
      - ./indexer-config/config.yaml:/opt/indexer-standalone/config.yaml:ro
      - indexer-data:/data
    depends_on:
      midnight-node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    ports:
      - "6300:6300"
    environment:
      - PORT=6300

volumes:
  midnight-node-data:
  indexer-data:
